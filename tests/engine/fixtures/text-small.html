<!doctype html><html lang="en"><head><meta charset="utf-8"><title>small text</title>
<style>body{font:16px Arial}p,div,span,li{margin:2px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style></head><body>
<p id="bad-1" style="font-size:9px">nine px</p>
<p id="bad-2" style="font-size:11px">eleven px</p>
<p id="bad-3" style="font-size:11.5px">eleven and a half</p>
<span id="bad-4" style="font-size:9.5px">span small</span>
<p id="ok-1" style="font-size:12px">twelve</p>
<p id="ok-2" style="font-size:14px">fourteen</p>
<p>x<sub id="ok-3" style="font-size:9px">sub</sub><sup id="ok-4" style="font-size:8px">sup</sup></p>
<p id="ok-5" style="font-variant:small-caps;font-size:11px">Small Caps Text</p>
<p id="ok-6" style="display:none;font-size:8px">hidden</p>
<p id="ok-7" style="font-size:0">zero</p>
<div id="ok-8" style="font-size:10px">
  <p style="font-size:16px">big child only</p>
</div>
<p id="ok-9" class="sr" style="font-size:9px">sr only</p>
</body></html>
