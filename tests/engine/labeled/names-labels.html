<!doctype html><html lang="en"><head><meta charset="utf-8"><title>names and labels</title>
<style>.chip{width:44px;height:44px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}img{border:0}</style></head><body>
<button id="bad-n1" class="chip"><span style="display:inline-block;width:18px;height:18px;background:#ccc"></span></button>
<button id="bad-n2"><span aria-hidden="true">&times;</span></button>
<a id="bad-n3" href="/home">   </a>
<div id="bad-n4" role="button" tabindex="0"><svg width="20" height="20"><rect width="20" height="20"/></svg></div>
<button id="bad-n5" aria-labelledby="ghost-1"></button>
<button id="bad-n6" class="chip"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="18" height="18"></button>
<button id="ok-n1" aria-label="Sauvegarder le document">save</button>
<a id="ok-n2" href="#x"><span aria-hidden="true">&#9654;</span> Play the demo</a>
<span id="lb-n3">Helpful label</span><button id="ok-n3" aria-labelledby="lb-n3"></button>
<button id="ok-n4" title="More options"></button>
<button id="ok-n5"><span class="sr">Open navigation menu</span><span aria-hidden="true">&#9776;</span></button>
<input id="bad-l1" type="text" placeholder="Email address">
<label for="other-id">Label points elsewhere</label><input id="bad-l2" type="text">
<label><input id="bad-l3" type="checkbox"></label>
<textarea id="bad-l4" placeholder="Notes"></textarea>
<select id="ok-l1" aria-label="Sort order"><option>Relevance</option></select>
<label>Comments <textarea id="ok-l2"></textarea></label>
<label for="ok-l3"><img alt="Age in years" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="20" height="20"></label><input id="ok-l3" type="number">
<input id="ok-l4" type="text" title="Promo code">
</body></html>
